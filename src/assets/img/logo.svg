<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4158D0" />
      <stop offset="50%" style="stop-color:#C850C0" />
      <stop offset="100%" style="stop-color:#FFCC70" />
    </linearGradient>
  </defs>
  
  <!-- Text shadow definitions -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#333" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rectangle -->
  <rect width="400" height="120" rx="15" fill="url(#bgGradient)" />
  
  <!-- Main text -->
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="70" font-weight="bold" text-anchor="middle" fill="white" filter="url(#shadow)">RISHI</text>
  
  <!-- Decorative elements -->
  <circle cx="55" cy="75" r="5" fill="white" opacity="0.8" />
  <circle cx="345" cy="75" r="5" fill="white" opacity="0.8" />
  
  <!-- Underline -->
  <path d="M100 85 Q200 105 300 85" stroke="white" stroke-width="3" fill="none" />
</svg>